<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img"><rect width="760" height="470" fill="#1a1a2e" rx="14"/><text x="380.0" y="34" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">超池下注的 4 类触发  (MTT)</text><text x="380.0" y="54" fill="#8b9bb4" font-size="12" text-anchor="middle">结合 poker-alpha solver 实战 + GTO 通用原则 · 示意</text><rect x="270.0" y="195.0" width="220" height="68" rx="14" fill="#e94560" opacity="0.95"/><text x="380.0" y="221.0" fill="#0c1a14" font-size="18" font-weight="800" text-anchor="middle">超池下注 Overbet</text><text x="380.0" y="245.0" fill="#0c1a14" font-size="13" font-weight="700" text-anchor="middle">≈ 150% pot（> geometric）</text><line x1="380.0" y1="229.0" x2="60.0" y2="96.0" stroke="#5b8def" stroke-width="1.6" opacity="0.55"/><rect x="-90.0" y="30.0" width="300" height="132" rx="12" fill="#16213e" stroke="#5b8def" stroke-width="2"/><text x="60.0" y="56.0" fill="#5b8def" font-size="14.5" font-weight="800" text-anchor="middle">① 脆弱强牌：前载价值</text><text x="60.0" y="80.0" fill="#e6edf3" font-size="12" text-anchor="middle">你的强牌后续会贬值（被超牌反超）→</text><text x="60.0" y="100.0" fill="#e6edf3" font-size="12" text-anchor="middle">现在把价值提前放进池，用</text><text x="60.0" y="120.0" fill="#e6edf3" font-size="12" text-anchor="middle">&gt;geometric 的大注。</text><line x1="380.0" y1="229.0" x2="700.0" y2="96.0" stroke="#4ecca3" stroke-width="1.6" opacity="0.55"/><rect x="550.0" y="30.0" width="300" height="132" rx="12" fill="#16213e" stroke="#4ecca3" stroke-width="2"/><text x="700.0" y="56.0" fill="#4ecca3" font-size="14.5" font-weight="800" text-anchor="middle">② 动态 / 听牌密集面</text><text x="700.0" y="80.0" fill="#e6edf3" font-size="12" text-anchor="middle">牌面允许大量顺/同花听牌 → solver</text><text x="700.0" y="100.0" fill="#e6edf3" font-size="12" text-anchor="middle">下注尺寸明显上推，压制听牌、拿满价值。</text><line x1="380.0" y1="229.0" x2="60.0" y2="374.0" stroke="#f0a500" stroke-width="1.6" opacity="0.55"/><rect x="-90.0" y="308.0" width="300" height="132" rx="12" fill="#16213e" stroke="#f0a500" stroke-width="2"/><text x="60.0" y="334.0" fill="#f0a500" font-size="14.5" font-weight="800" text-anchor="middle">③ 极化范围 + 对手 capped</text><text x="60.0" y="358.0" fill="#e6edf3" font-size="12" text-anchor="middle">你两端极化、对手范围封顶 →</text><text x="60.0" y="378.0" fill="#e6edf3" font-size="12" text-anchor="middle">超池同时拿价值（坚果）与诈唬（空气）。</text><line x1="380.0" y1="229.0" x2="700.0" y2="374.0" stroke="#a06bff" stroke-width="1.6" opacity="0.55"/><rect x="550.0" y="308.0" width="300" height="132" rx="12" fill="#16213e" stroke="#a06bff" stroke-width="2"/><text x="700.0" y="334.0" fill="#a06bff" font-size="14.5" font-weight="800" text-anchor="middle">④ 对抗跟注站的危险面</text><text x="700.0" y="358.0" fill="#e6edf3" font-size="12" text-anchor="middle">对手爱跟注、但只在稀缺场景会弃 →</text><text x="700.0" y="378.0" fill="#e6edf3" font-size="12" text-anchor="middle">在他会弃牌的威胁面用超池施压。</text><text x="380.0" y="456.0" fill="#8b9bb4" font-size="11" text-anchor="middle">MTT 码量有限，三条街下不完 → 把资源集中在最有把握的那条街（常是翻牌）</text></svg>