<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" role="img"><rect width="760" height="260" fill="#1a1a2e" rx="14"/><text x="380.0" y="34" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Tilt 四阶段风险条  (NL10 心态)</text><text x="380.0" y="54" fill="#8b9bb4" font-size="12" text-anchor="middle">止损触发线：-3 组立即关桌 · 追损期 5 分钟强制暂停</text><rect x="40" y="110" width="162" height="46" rx="8" fill="#5b8def" opacity="0.92"/><text x="121.0" y="132.0" fill="#0c1a14" font-size="13" font-weight="700" text-anchor="middle">🔵 否认期</text><text x="121.0" y="150.0" fill="#0c1a14" font-size="11" text-anchor="middle">买入损失 -1 ~ -3</text><text x="121.0" y="176.0" fill="#8b9bb4" font-size="10.5" text-anchor="middle">选择性记忆，只看自己输的大牌</text><rect x="210" y="110" width="162" height="46" rx="8" fill="#f0a500" opacity="0.92"/><text x="291.0" y="132.0" fill="#0c1a14" font-size="13" font-weight="700" text-anchor="middle">🟡 追损期</text><text x="291.0" y="150.0" fill="#0c1a14" font-size="11" text-anchor="middle">买入损失 -3 ~ -5</text><text x="291.0" y="176.0" fill="#8b9bb4" font-size="10.5" text-anchor="middle">范围放宽、决策加速 · 最危险</text><rect x="380" y="110" width="162" height="46" rx="8" fill="#a06bff" opacity="0.92"/><text x="461.0" y="132.0" fill="#0c1a14" font-size="13" font-weight="700" text-anchor="middle">🟠 愤怒期</text><text x="461.0" y="150.0" fill="#0c1a14" font-size="11" text-anchor="middle">买入损失 -5 ~ -15</text><text x="461.0" y="176.0" fill="#8b9bb4" font-size="10.5" text-anchor="middle">复仇式打法、all-in 频率飙升</text><rect x="550" y="110" width="162" height="46" rx="8" fill="#e94560" opacity="0.92"/><text x="631.0" y="132.0" fill="#0c1a14" font-size="13" font-weight="700" text-anchor="middle">🔴 崩盘期</text><text x="631.0" y="150.0" fill="#0c1a14" font-size="11" text-anchor="middle">买入损失 -15 ~ -100</text><text x="631.0" y="176.0" fill="#8b9bb4" font-size="10.5" text-anchor="middle">清空、卸载 app、发誓戒赌</text></svg>