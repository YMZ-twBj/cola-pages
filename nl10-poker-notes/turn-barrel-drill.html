// ─── Rendering ───

function pickScenario() {
  let pool;
  if (mode === 'all') {
    pool = SCENARIOS;
  } else if (mode === 'barrel') {
    pool = SCENARIOS.filter(s => s.mode === 'barrel');
  } else {
    pool = SCENARIOS.filter(s => s.mode === 'check');
  }

  // Avoid immediate repeats by filtering out the last 3 shown IDs
  let candidates = pool;
  if (recentIds.length > 0 && pool.length > 3) {
    const filtered = pool.filter(s => !recentIds.includes(s.id));
    if (filtered.length > 0) candidates = filtered;
  }

  const pick = candidates[Math.floor(Math.random() * candidates.length)];

  // Track recent
  recentIds.push(pick.id);
  if (recentIds.length > 5) recentIds.shift();

  return pick;
}

function renderHand() {
  answered = false;
  current = pickScenario();

  document.getElementById('heroCards').innerHTML =
    current.hero.map(c => cardHTML(c)).join('');
  document.getElementById('boardFlop').innerHTML =
    current.flop.map(c => cardHTML(c)).join('');
  document.getElementById('turnCard').innerHTML = cardHTML(current.turn);
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').className = 'next-btn';

  const oopNote = current.ip ? '' : ' <span style="color:#f85149">[OOP]</span>';
  const actionHTML = current.actionLines.map(l =>
    `<span class="action-line">${l}</span>`
  ).join('');

  document.getElementById('spotInfo').innerHTML = `
    <span style="color:#d2991d;font-weight:bold">${current.title}</span><br>
    位置: ${current.position}${oopNote}<br>
    ${actionHTML}
  `;

  document.getElementById('stepLabel').textContent = '繼續 Barrel 還是 Check？';
  document.getElementById('actions').innerHTML = `
    <button class="btn btn-barrel" onclick="answer('barrel')">🔥 Barrel</button>
    <button class="btn btn-check" onclick="answer('check')">🛑 Check</button>
  `;

  document.getElementById('progress').textContent =
    `已答 ${totalAnswered} 題 · 題庫 ${SCENARIOS.length} 題 · 當前模式: ${modeLabel()}`;

  document.querySelectorAll('.btn').forEach(b => b.disabled = false);
}

function modeLabel() {
  if (mode === 'all') return '全部';
  if (mode === 'barrel') return '🔥 只練 Barrel';
  return '🛑 只練 Check';
}

function answer(action) {
  if (answered) return;
  answered = true;
  totalAnswered++;
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);

  const isCorrect = action === current.correctAction;
  const fb = document.getElementById('feedback');

  if (isCorrect) {
    correct++; streak++;
    fb.className = 'feedback show correct';

    let sizingNote = '';
    if (current.correctAction === 'barrel' && current.sizing) {
      sizingNote = `<br><span style="color:#3fb950">🎯 推薦下注尺寸：${current.sizing}</span>`;
    }

    fb.innerHTML = `✅ <span style="color:#3fb950">正確！</span>${action === 'barrel' ? '繼續 Barrel 🔥' : '停下來 Check 🛑'}。${sizingNote}<div class="reason">${current.explanation}</div>`;
  } else {
    wrong++; streak = 0;
    fb.className = 'feedback show wrong';

    const correctLabel = current.correctAction === 'barrel' ? '🔥 Barrel' : '🛑 Check';
    fb.innerHTML = `❌ 你選了 ${action === 'barrel' ? 'Barrel' : 'Check'}，但正確是 <span style="color:#ffa726">${correctLabel}</span>。<div class="reason">${current.explanation}</div>`;
  }

  updateScore();
  document.getElementById('nextBtn').className = 'next-btn show';
  document.getElementById('progress').textContent =
    `已答 ${totalAnswered} 題 · 題庫 ${SCENARIOS.length} 題 · 當前模式: ${modeLabel()}`;
}

function nextHand() { renderHand(); }

function updateScore() {
  document.getElementById('correctN').textContent = correct;
  document.getElementById('wrongN').textContent = wrong;
  const total = correct + wrong;
  document.getElementById('pct').textContent = total > 0 ? (correct/total*100).toFixed(0) + '%' : '--';
  document.getElementById('streak').textContent = streak;
  localStorage.setItem('turnBarrel_' + mode, JSON.stringify({correct, wrong, streak, totalAnswered}));
}

function loadScore() {
  const s = JSON.parse(localStorage.getItem('turnBarrel_' + mode) || '{}');
  correct = s.correct || 0; wrong = s.wrong || 0; streak = s.streak || 0;
  totalAnswered = s.totalAnswered || 0;
  updateScore();
}

function setMode(m) {
  mode = m;
  document.getElementById('modeAll').className = 'mode-btn' + (m === 'all' ? ' active' : '');
  document.getElementById('modeBarrel').className = 'mode-btn' + (m === 'barrel' ? ' active' : '');
  document.getElementById('modeCheck').className = 'mode-btn' + (m === 'check' ? ' active' : '');
  recentIds = [];
  loadScore();
  renderHand();
}

// ─── Init ───
loadScore();
renderHand();
</script>
